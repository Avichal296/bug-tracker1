<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc">
<title id="title">Paint manufacturer ERP and inventory architecture</title><desc id="desc">Modular ERP with procurement, production, inventory, sales, finance and reporting modules, integrations, controls and shared database.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#55718c"/></marker><style>
text{font-family:Arial,Helvetica,sans-serif;fill:#172b3a}.title{font-size:30px;font-weight:700}.sub{font-size:15px;fill:#516879}.h{font-size:19px;font-weight:700}.b{font-size:14px}.small{font-size:12px;fill:#435b6d}.mod{fill:#fff;stroke:#45738d;stroke-width:2}.ext{fill:#f5f7fa;stroke:#8799a7;stroke-width:2}.plat{fill:#eaf4f7;stroke:#3c8292;stroke-width:2}.line{stroke:#55718c;stroke-width:2;fill:none;marker-end:url(#arrow)}.dash{stroke-dasharray:7 6}.green{stroke:#48816c}.orange{stroke:#bb8952}
</style></defs>
<rect width="1600" height="1050" fill="#fbfcfd"/><text x="56" y="58" class="title">Integrated ERP &amp; Inventory Management | Paint Manufacturer</text><text x="56" y="87" class="sub">High-level architecture • modular business capabilities • controlled data flow • phased migration from Excel and Tally</text>
<!-- external systems -->
<rect x="55" y="145" width="250" height="105" rx="13" class="ext"/><text x="78" y="179" class="h">Suppliers</text><text x="78" y="207" class="b">Quotes • purchase orders • ASN</text><text x="78" y="229" class="small">Vendor portal / email / EDI</text>
<rect x="55" y="302" width="250" height="120" rx="13" class="ext"/><text x="78" y="338" class="h">Plant floor</text><text x="78" y="366" class="b">Scales • barcode/RFID • PLC/SCADA</text><text x="78" y="391" class="small">Batch consumption and output events</text>
<rect x="55" y="490" width="250" height="115" rx="13" class="ext"/><text x="78" y="526" class="h">Customers &amp; carriers</text><text x="78" y="554" class="b">Orders • dispatch • delivery updates</text><text x="78" y="578" class="small">Portal / API / EDI</text>
<!-- ERP boundary -->
<rect x="350" y="125" width="900" height="535" rx="20" fill="#f4f8fa" stroke="#b7c8d3" stroke-width="2"/><text x="380" y="159" class="h">ERP application layer</text>
<rect x="385" y="190" width="245" height="155" rx="13" class="mod"/><text x="407" y="224" class="h">Procurement</text><text x="407" y="254" class="b">Indent • approval • PO</text><text x="407" y="278" class="b">Vendor scorecard • receive</text><text x="407" y="316" class="small">Procure-to-pay workflow</text>
<rect x="675" y="190" width="245" height="155" rx="13" class="mod"/><text x="697" y="224" class="h">Production</text><text x="697" y="254" class="b">BOM • MRP • work orders</text><text x="697" y="278" class="b">WIP • batch / QC results</text><text x="697" y="316" class="small">Plan-to-produce workflow</text>
<rect x="965" y="190" width="245" height="155" rx="13" class="mod"/><text x="987" y="224" class="h">Inventory</text><text x="987" y="254" class="b">Raw / WIP / finished stock</text><text x="987" y="278" class="b">Lot • expiry • location • reorder</text><text x="987" y="316" class="small">Consignment and traceability</text>
<rect x="385" y="425" width="245" height="155" rx="13" class="mod"/><text x="407" y="459" class="h">Sales &amp; distribution</text><text x="407" y="489" class="b">Quote • order • tiered pricing</text><text x="407" y="513" class="b">Allocation • pick • dispatch</text><text x="407" y="551" class="small">Order-to-cash workflow</text>
<rect x="675" y="425" width="245" height="155" rx="13" class="mod"/><text x="697" y="459" class="h">Finance</text><text x="697" y="489" class="b">GL • AP / AR • tax • costing</text><text x="697" y="513" class="b">Batch / product profitability</text><text x="697" y="551" class="small">Journal rules + reconciliation</text>
<rect x="965" y="425" width="245" height="155" rx="13" class="mod"/><text x="987" y="459" class="h">Reporting &amp; analytics</text><text x="987" y="489" class="b">Turnover • fulfillment • margin</text><text x="987" y="513" class="b">Sales trends • batch compliance</text><text x="987" y="551" class="small">Dashboards • scheduled exports</text>
<!-- flows -->
<path d="M630 266H675" class="line"/><path d="M920 266H965" class="line"/><path d="M800 345V390H1085V345" class="line"/><path d="M965 502H920" class="line"/><path d="M675 502H630" class="line"/><path d="M1085 425V345" class="line"/>
<path d="M305 197H385" class="line"/><path d="M305 360H965" class="line dash green"/><path d="M305 548H385" class="line"/>
<!-- data platform -->
<rect x="350" y="700" width="900" height="225" rx="20" fill="#f6f9fb" stroke="#b7c8d3" stroke-width="2"/><text x="380" y="735" class="h">Shared platform services</text>
<rect x="385" y="765" width="250" height="115" rx="12" class="plat"/><text x="405" y="797" class="h">Integration &amp; automation</text><text x="405" y="825" class="b">API gateway • event queue</text><text x="405" y="850" class="small">Retries • idempotency • adapters</text>
<rect x="675" y="765" width="250" height="115" rx="12" class="plat"/><text x="695" y="797" class="h">Operational data store</text><text x="695" y="825" class="b">Relational ERP database</text><text x="695" y="850" class="small">Transactions • audit • backups</text>
<rect x="965" y="765" width="245" height="115" rx="12" class="plat"/><text x="985" y="797" class="h">Analytics store</text><text x="985" y="825" class="b">Curated reporting models</text><text x="985" y="850" class="small">Warehouse / BI semantic layer</text>
<path d="M510 660V765" class="line dash"/><path d="M800 660V765" class="line dash"/><path d="M1085 660V765" class="line dash"/><path d="M635 822H675" class="line"/><path d="M925 822H965" class="line"/>
<!-- external finance -->
<rect x="1310" y="300" width="235" height="125" rx="13" class="ext"/><text x="1333" y="338" class="h">Tally (transition)</text><text x="1333" y="367" class="b">Opening balances • mapped</text><text x="1333" y="391" class="small">Reconcile, then retire or sync</text><path d="M920 505H1290V365H1310" class="line dash orange"/>
<rect x="1310" y="490" width="235" height="115" rx="13" class="ext"/><text x="1333" y="528" class="h">Identity provider</text><text x="1333" y="556" class="b">SSO • roles • MFA</text><text x="1333" y="580" class="small">Staff access lifecycle</text><path d="M1310 548H1265V640H800V660" class="line dash"/>
<!-- guardrail bar -->
<rect x="55" y="960" width="1490" height="57" rx="12" fill="#eaf0f4"/><text x="78" y="994" class="b" font-weight="700">Cross-cutting controls:</text><text x="244" y="994" class="b">role-based access • least privilege • TLS / encryption • audit trail • environment separation • backups / disaster recovery • monitoring</text>
<text x="55" y="645" class="small">Business events: receipt → lot stock → batch consumption → QC release → finished goods → sales allocation → invoice / ledger posting</text>
</svg>
